<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rivers of the World</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="title" tabindex="0">
    <h1>Rivers of the World <span class="info-icon" aria-hidden="true">i</span></h1>
    <div class="details">
      <p>Zoom in to see smaller rivers. Hover over or tap a river to see its name.</p>
      <p class="credits">
        River, lake and land data from <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.
        Map rendered with <a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre</a>,
        label fonts from <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a>.
      </p>
      <p><a href="https://github.com/andunieee/river-map" target="_blank" rel="noopener">Source code on GitHub</a></p>
    </div>
  </div>
  <div id="tooltip" hidden></div>
  <div id="loading">Loading rivers…</div>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="main.js"></script>
</body>
</html>
